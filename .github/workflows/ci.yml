name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          CI: 'true'
      - name: README tool reference is up to date
        run: node scripts/gen-tools-doc.mjs && git diff --exit-code README.md
      - name: Package contents
        run: npm pack --dry-run
